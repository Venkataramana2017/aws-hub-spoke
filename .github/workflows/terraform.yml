name: Terraform

on:
  push:
  workflow_dispatch:
    inputs:
      command:
        description: Terraform operation to run
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      debug_oidc:
        description: Display non-sensitive GitHub OIDC claims for IAM trust-policy troubleshooting
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  branch-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject main and non-branch refs
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "Terraform may run only from branches other than main."
            exit 1
          fi

  terraform:
    # Pushes create plans; apply and destroy are manual-only operations.
    needs: branch-guard
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'push' || inputs.command == 'plan') && 'terraform-plan' || 'terraform-changes' }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Repository/environment variables override these defaults when configured.
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_availability_zones: ${{ vars.TF_AVAILABILITY_ZONES || '["us-east-1a", "us-east-1b"]' }}

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Verify AWS OIDC configuration
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [[ -z "${AWS_ROLE_ARN}" ]]; then
            echo "AWS_ROLE_ARN is not available. Add it as a repository secret, or as a secret in the selected GitHub Environment."
            exit 1
          fi
          if [[ "${AWS_ROLE_ARN}" != arn:aws:iam::*:role/* ]]; then
            echo "AWS_ROLE_ARN must contain the full IAM role ARN, for example arn:aws:iam::313932316713:role/github-actions-aws-hub-spoke-terraform."
            exit 1
          fi

      - name: Display OIDC claims for troubleshooting
        if: github.event_name == 'push' || inputs.debug_oidc
        shell: bash
        run: |
          token_response=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          token=$(jq --raw-output '.value' <<< "${token_response}")
          OIDC_TOKEN="${token}" node <<'NODE'
          const claims = JSON.parse(Buffer.from(process.env.OIDC_TOKEN.split(".")[1], "base64url"));
          console.log(JSON.stringify({
            sub: claims.sub,
            aud: claims.aud,
            ref: claims.ref,
            repository: claims.repository,
            repository_owner: claims.repository_owner,
            environment: claims.environment,
          }, null, 2));
          NODE

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate configuration
        run: terraform validate

      - name: Create plan
        if: github.event_name == 'push' || inputs.command == 'plan' || inputs.command == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Apply plan
        if: inputs.command == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

      - name: Create destroy plan
        if: inputs.command == 'destroy'
        run: terraform plan -destroy -input=false -out=tfdestroy

      - name: Destroy managed infrastructure
        if: inputs.command == 'destroy'
        run: terraform apply -input=false -auto-approve tfdestroy
